  </defs>

  <!-- Bingkai -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="#F8FAFF" stroke="#4F46E5" stroke-width="20"/>

  <!-- Grafik batang -->
  <rect x="322" y="190" width="32" height="80" rx="8" fill="url(#bar)"/>
  <rect x="366" y="150" width="32" height="120" rx="8" fill="url(#bar)"/>
  <rect x="410" y="100" width="32" height="170" rx="8" fill="url(#bar)"/>

  <!-- Kotak produk -->
  <polygon points="235,150 305,185 235,220 165,185" fill="#312E81" stroke="#F8FAFF" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="165,185 235,220 235,296 165,261" fill="#1E1B6B" stroke="#F8FAFF" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="235,220 305,185 305,261 235,296" fill="#26238A" stroke="#F8FAFF" stroke-width="6" stroke-linejoin="round"/>

  <!-- Keranjang -->
  <polygon points="150,250 400,250 372,330 176,330" fill="#1E1B6B" stroke="#1E1B6B" stroke-width="10" stroke-linejoin="round"/>
  <path d="M84 150 H124 L176 330" fill="none" stroke="#1E1B6B" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="206" cy="388" r="24" fill="#1E1B6B"/>
  <circle cx="346" cy="388" r="24" fill="#1E1B6B"/>

  <!-- Barcode di keranjang -->
  <g fill="#F8FAFF">
    <rect x="226" y="266" width="8" height="44"/>
    <rect x="242" y="266" width="5" height="44"/>
    <rect x="255" y="266" width="10" height="44"/>
    <rect x="273" y="266" width="5" height="44"/>
    <rect x="286" y="266" width="8" height="44"/>
    <rect x="302" y="266" width="5" height="44"/>
    <rect x="315" y="266" width="8" height="44"/>
  </g>

  <!-- Panah naik -->
  <path d="M176 350 Q330 336 420 206" fill="none" stroke="url(#arrow)" stroke-width="20" stroke-linecap="round"/>
  <polygon points="446,160 456,236 388,204" fill="#38BDF8" stroke="#38BDF8" stroke-width="6" stroke-linejoin="round"/>
